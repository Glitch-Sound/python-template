# 新規 change 作成時に使用するプロジェクト既定のワークフロー。
# `openspec new change` はこの値を読み、各 change の `.openspec.yaml` に記録する。
schema: my-workflow

# すべての成果物の生成・更新時に読み込む共通コンテキスト。
context: |
  ## 最優先プロジェクト規約
  AI エージェントは、変更の調査、提案、設計、実装、検証の前に次のファイルを必ず読み込むこと。
  - @openspec/product.md
  - @openspec/tech.md
  - @openspec/structure.md

  これらの文書と既存コード・設定の間に差異がある場合は、推測で実装せず、差異を明示して
  既存コード、README、pyproject.toml、ロックファイルを根拠に影響を確認すること。

  ## 記述と言語
  - 成果物（proposal、spec、design、tasks）およびチャット応答は日本語で記述する。
  - コード、ファイルパス、コマンド、設定キー、ライブラリ名は既存の表記を維持する。
  - 要件は観測可能かつ検証可能に書き、曖昧な表現を避ける。
  - 仕様上の要件は EARS 記法を使用し、各要件に Given/When/Then のシナリオを1つ以上対応付ける。
  - 機能要件は `REQ-001`、非機能要件は `NREQ-001`、Scenario は `<要件ID>-S01`、試験ケースは `TC-001` 形式で管理する。採番済みIDは再利用・再採番しない。
  - 実装変更を伴う全Scenarioには自動テストコードを作成する。手動試験は補助とし、例外は理由、承認者、期限を設計書に記録する。

  ## 変更時の原則
  - 既存の公開インターフェース、設定形式、CLI の振る舞いを変更する場合は、互換性、移行、
    ロールバックを proposal と design に明記する。
  - 実装前に影響を受けるコードとテストを調査し、変更後はプロジェクトで定義された品質チェックを実行する。
  - 関係のないリファクタリング、依存関係更新、フォーマット変更を同じ変更に混在させない。

rules:
  specs:
    - 要件本文は EARS 記法で「条件・トリガー・期待結果」を明示し、SHALL 相当の「しなければならない」を用いる。
    - 各要件は1つの振る舞いだけを規定し、実装のクラス名、関数名、ライブラリ名、処理手順を含めない。
    - 各 Scenario は `#### Scenario:` 見出しを使い、正常系に加えて仕様上重要な異常系・境界値・権限制御を記述する。
    - 既存要件を変更する場合は、対象 Requirement ブロックを省略せずに `MODIFIED Requirements` に記載する。
    - "`Test Policy` に要件区分ごとの試験層、試験パターン、自動化方針を記載する。"
  design:
    - spec の全要件を設計節、実装対象、実装タスク、TC-ID、検証方法に対応付けるトレーサビリティ表を作成する。
    - "`Test Design` で全ScenarioをTC-ID、pytest 実装、前提・操作・期待値に対応付け、`Coverage Confirmation` で未対応Scenarioがないことを確認する。"
    - 責務境界、処理順序、データ契約、失敗時の結果、冪等性・再試行・タイムアウトを必要に応じて確定し、実装者に判断を残さない。
    - 未確定事項のうち、採用方式・タスク分解・仕様を変えるものは実装前に解決する。
    - データ、API、設定、外部連携に影響する変更では、移行、互換期間、ロールバック、運用上の確認方法を記載する。
  tasks:
    - 各タスクに変更対象、具体的な実施内容、対応する要件または設計節、完了条件を記載する。
    - タスクは依存関係順に並べ、全TC-IDに対応する自動テスト実装タスク、品質チェック、移行・運用作業を含める。
    - 未実施のタスクを完了扱いにせず、実施・検証済みの場合のみチェックボックスを完了にする。

operations:
  apply:
    guidance:
      - 実装前に proposal、spec、design、tasks と既存コードを確認し、矛盾または未解決の判断があれば先に解消する。
      - Python の依存関係は uv で管理し、pyproject.toml と uv.lock を一貫して更新する。
      - 実装後は少なくとも `uv run --locked ruff check .`、`uv run --locked ruff format --check .`、`uv run --locked pyright`、`uv run --locked pytest` を実行する。
  archive:
    guidance:
      - アーカイブ前に `openspec validate <change-name> --strict` を実行し、proposal の capability と spec の差分が対応していることを確認する。
      - tasks の未完了項目、未解決の Open Questions、未検証の受け入れ条件がある場合は、完了または明示的な合意なしにアーカイブしない。
