name: my-workflow
version: 1
description: 日本語・EARS 記法を用いる Python プロジェクト向けの OpenSpec ワークフロー
artifacts:
  - id: proposal
    generates: proposal.md
    description: 変更の目的、範囲、仕様対象を定める提案書
    template: proposal.md
    instruction: >
      proposal.md を日本語で作成する。Why には現状、問題、放置時の影響、期待する状態を記述する。
      What Changes には利用者または外部システムから観測できる差分を列挙し、破壊的変更には BREAKING を付ける。
      Scope と Acceptance Criteria で対象・非対象・完了判定を明確にする。Capabilities は proposal と spec の契約であるため、
      既存仕様を調査し、追加または変更する capability の正確なパスを記述する。実装方法は design.md に記述し、
      proposal には含めない。仕様レベルの振る舞いが変わらない変更は .openspec.yaml の skip_specs: true を使用する。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: capability ごとの検証可能な振る舞いを定義する差分仕様
    template: spec.md
    instruction: >
      proposal.md の Capabilities に対応する spec ファイルを日本語で作成する。仕様は実装計画ではなく、利用者または
      外部システムから観測できる振る舞いの契約とする。各 Requirement は EARS 記法で、単一かつ検証可能な
      「条件・トリガー・結果」を規定し、実装のクラス、関数、ライブラリ、処理手順を含めない。各 Requirement には
      必ず #### Scenario: 見出しのシナリオを1つ以上含め、WHEN と THEN を記述する。新規 capability には
      50文字以上の Purpose を記述する。既存要件を変更する場合は Requirement ブロック全体を MODIFIED Requirements
      に複写して更新し、廃止には Reason と Migration を含める。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: 仕様を満たす実装方法と技術判断を定義する設計書
    template: design.md
    instruction: >
      proposal.md と specs を根拠に、design.md を日本語で作成する。spec の全要件を Requirements Traceability で
      設計節、実装対象、検証方法へ対応付ける。Architecture and Responsibilities、Processing Flow、State and Data Design、
      Interfaces and Error Handling により、責務の配置、処理順、データ・境界契約、成功・失敗時の結果を実装者が
      判断せずに実装できる粒度で確定する。重要な技術選定には採用内容、根拠、代替案、不変条件を記述する。
      該当する場合はセキュリティ、性能、運用、移行、ロールバック、テスト戦略を具体化する。仕様、採用方式、
      タスク分解を変更し得る未解決事項を残してはならない。
    requires:
      - specs
  - id: tasks
    generates: tasks.md
    description: 設計を実装・検証可能な順序に分解した実施チェックリスト
    template: tasks.md
    instruction: >
      proposal.md、specs、design.md を根拠に tasks.md を日本語で作成する。各タスクは `- [ ] X.Y` のチェックボックス形式にし、
      変更対象、具体的な実施内容、対応する要件または設計節、検証可能な完了条件を含める。依存関係順に並べ、
      テスト、品質チェック、移行・運用作業を必要に応じて含める。「実装する」「テストを追加する」だけの曖昧なタスクを
      作らない。実施・検証済みの場合のみチェックボックスを完了にする。
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    proposal、specs、design、tasks とプロジェクトコンテキストを読み、未完了タスクを依存関係順に実施する。
    各タスクの完了条件を検証してからチェックボックスを完了にする。仕様・設計にない重要な判断やブロッカーがある場合は、
    実装を進めずに変更成果物または利用者との合意を先に更新する。
