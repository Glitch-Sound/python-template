default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: repository-checks
        name: Repository checks
        entry: uv run --locked python scripts/check_repository.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
