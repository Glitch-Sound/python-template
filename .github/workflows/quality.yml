name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: npm run check
      # Safety 3 の scan は CI 用 API キーを要求するため、導入までは check を使う。
      - run: uv run --locked safety check --full-report
